<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Vitrina PEZ · Colección de dispensadores</title>
<style>
:root{--bg:#14101c;--card:#211a2e;--gold:#e8c26b;--txt:#f2eee8;--mut:#a99fb8}
*{box-sizing:border-box}body{margin:0;font-family:system-ui,Segoe UI,Roboto,sans-serif;background:radial-gradient(circle at top,#2d2140,var(--bg) 60%);color:var(--txt);min-height:100vh}
header{text-align:center;padding:40px 16px 20px}h1{margin:0;font-family:Georgia,serif;font-size:clamp(2rem,6vw,3.2rem);color:var(--gold);letter-spacing:2px}
.sub{color:var(--mut);margin-top:6px}.stats{display:flex;gap:14px;justify-content:center;flex-wrap:wrap;margin:22px 0}
.stat{background:var(--card);border:1px solid #3a2e4f;border-radius:14px;padding:12px 22px}.stat b{display:block;font-size:1.5rem;color:var(--gold)}
#q{width:min(520px,92vw);padding:12px 16px;border-radius:30px;border:1px solid #4a3b63;background:#1b1526;color:var(--txt);font-size:1rem}
main{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:22px;padding:24px;max-width:1200px;margin:auto}
.c{background:linear-gradient(180deg,#2a2139,var(--card));border:1px solid #3a2e4f;border-radius:18px;overflow:hidden;cursor:pointer;transition:.25s;box-shadow:0 8px 24px #0006}
.c:hover{transform:translateY(-5px);border-color:var(--gold)}.c .ph{aspect-ratio:1;background:#fff1 center/cover;position:relative}
.c .ph img{width:100%;height:100%;object-fit:cover}.tag{position:absolute;top:10px;left:10px;background:#000a;color:var(--gold);padding:3px 10px;border-radius:20px;font-size:.8rem}
.c .bd{padding:14px}.c h3{margin:0 0 6px;font-size:1.1rem}.c p{margin:3px 0;color:var(--mut);font-size:.88rem}.v{color:var(--gold)!important;font-weight:600;margin-top:8px!important}
#m{position:fixed;inset:0;background:#000c;display:none;align-items:center;justify-content:center;padding:16px;z-index:9}
#m .box{background:var(--card);border:1px solid var(--gold);border-radius:18px;max-width:860px;width:100%;max-height:92vh;overflow:auto;display:grid;grid-template-columns:1fr 1fr}
#m img{width:100%;display:block}#m .inf{padding:22px}#m h2{margin-top:0;color:var(--gold);font-family:Georgia,serif}
#m dt{color:var(--mut);font-size:.8rem;text-transform:uppercase;margin-top:10px}#m dd{margin:2px 0 0}
.x{float:right;background:none;border:0;color:var(--txt);font-size:1.6rem;cursor:pointer}
@media(max-width:700px){#m .box{grid-template-columns:1fr}}footer{text-align:center;color:var(--mut);font-size:.8rem;padding:30px}
</style></head><body>
<header><h1>🍬 Vitrina PEZ</h1><div class="sub">Colección privada de dispensadores PEZ</div>
<div class="stats"><div class="stat"><b id="n"></b>piezas</div><div class="stat"><b>$2.000 – $5.000</b>valor estimado (CLP)</div></div>
<input id="q" placeholder="Buscar personaje, serie, país, estado…"></header>
<main id="g"></main>
<div id="m" onclick="if(event.target==this)cerrar()"><div class="box"><div id="mi"></div><div class="inf"><button class="x" onclick="cerrar()">×</button><div id="md"></div></div></div></div>
<footer>Valores referenciales basados en ventas reales (eBay y mercado chileno). Actualizado 2026-10-21.</footer>
<script>
const D=[{"id": "PEZ-001", "personaje": "R2-D2 (Star Wars)", "serie": "Star Wars, 1997", "fabricacion": "Hungría", "patente": "U.S. 4.966.305", "tallo": "azul con pies", "estado": "Muy bueno, suelto, sin envase", "autenticidad": "Auténtico", "valor_usd": "2-5", "valor_clp": "2.000-5.000", "venta_chile_clp": "4.000-7.000", "dolar": 978.56, "fecha": "2026-10-21", "imgs": ["img/PEZ-001.jpg"]}];const e=s=>String(s??'—').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const F=[['serie','Serie / época'],['fabricacion','Fabricación'],['patente','Patente'],['tallo','Tallo'],['estado','Estado'],['autenticidad','Autenticidad'],['valor_usd','Valor internacional (USD)'],['valor_clp','Valor estimado (CLP)'],['venta_chile_clp','Precio sugerido Chile (CLP)'],['traia','Qué traía'],['precio_original','Precio original'],['notas','Notas'],['fecha','Ingreso']];
function r(){const q=document.getElementById('q').value.toLowerCase();const L=D.filter(p=>JSON.stringify(p).toLowerCase().includes(q));
document.getElementById('n').textContent=D.length;
document.getElementById('g').innerHTML=L.map(p=>`<div class="c" onclick="ver('${p.id}')"><div class="ph">${p.imgs[0]?`<img loading="lazy" src="${p.imgs[0]}" alt="${e(p.personaje)}">`:''}<span class="tag">${e(p.id)}</span></div><div class="bd"><h3>${e(p.personaje)}</h3><p>${e(p.serie)}</p><p>🏭 ${e(p.fabricacion)} · ${e(p.patente)}</p><p>⭐ ${e(p.estado)}</p><p>✔ ${e(p.autenticidad)}</p><p class="v">$${e(p.valor_clp)} CLP</p></div></div>`).join('')||'<p>Sin resultados.</p>'}
function ver(id){const p=D.find(x=>x.id==id);document.getElementById('mi').innerHTML=p.imgs.map(s=>`<img src="${s}">`).join('');
document.getElementById('md').innerHTML=`<h2>${e(p.personaje)}</h2><dl>${F.filter(f=>p[f[0]]).map(f=>`<dt>${f[1]}</dt><dd>${e(p[f[0]])}</dd>`).join('')}</dl>`;
document.getElementById('m').style.display='flex';location.hash=id}
function cerrar(){document.getElementById('m').style.display='none';history.replaceState(null,'',' ')}
document.getElementById('q').oninput=r;document.onkeydown=k=>k.key=='Escape'&&cerrar();r();if(location.hash)ver(location.hash.slice(1));
</script></body></html>

const e=s=>String(s??'—').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const norm=s=>String(s??'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'');
const F=[['stock','Stock (unidades)'],['serie','Serie / época'],['fabricacion','Fabricación'],['patente','Patente'],['tallo','Tallo'],['estado','Estado'],['autenticidad','Autenticidad'],['valor_usd','Valor internacional (USD)'],['valor_clp','Valor estimado (CLP)'],['venta_chile_clp','Precio sugerido Chile (CLP)'],['traia','Qué traía'],['precio_original','Precio original'],['notas','Notas'],['fecha','Ingreso']];
function limpiar(){
  const qEl=document.getElementById('q');
  qEl.value='';
  r();
  qEl.focus();
}
function r(){
  const rawQ=document.getElementById('q').value||'';
  document.getElementById('btnClr').style.display=rawQ.length?'inline-flex':'none';
  const q=norm(rawQ.trim());
  const fy=document.getElementById('fYear').value;
  const fp=document.getElementById('fPrice').value;
  const fs=document.getElementById('fSort').value;
  let L=D.filter(p=>{
    if(q && !norm(JSON.stringify(p)).includes(q)) return false;
    if(fy!=='all' && p.era!==fy) return false;
    if(fp==='high' && p.pmax<6000) return false;
    if(fp==='mid' && (p.pmax<4000 || p.pmax>=6000)) return false;
    if(fp==='low' && p.pmax>=4000) return false;
    return true;
  });
  L.sort((a,b)=>{
    if(fs==='price_desc') return (b.pmax-a.pmax)||(b.pmin-a.pmin)||(b.cmax-a.cmax)||a.id.localeCompare(b.id);
    if(fs==='price_asc') return (a.pmin-b.pmin)||(a.pmax-b.pmax)||(a.cmax-b.cmax)||a.id.localeCompare(b.id);
    if(fs==='year_asc') return (a.ymin-b.ymin)||(a.ymax-b.ymax)||(b.pmax-a.pmax);
    if(fs==='year_desc') return (b.ymax-a.ymax)||(b.ymin-a.ymin)||(b.pmax-a.pmax);
    return a.id.localeCompare(b.id);
  });
  document.getElementById('n').textContent=D.reduce((s,p)=>s+(+p.stock||1),0);
  const shownUnits=L.reduce((s,p)=>s+(+p.stock||1),0);
  document.getElementById('cnt').textContent=`Mostrando ${L.length} registro(s) (${shownUnits} unidades)`;
  document.getElementById('g').innerHTML=L.map(p=>`<div class="c" onclick="ver('${p.id}')"><div class="ph">${p.imgs[0]?`<img loading="lazy" src="${p.imgs[0]}" alt="${e(p.personaje)}">`:''}<span class="tag">${e(p.id)}${(p.stock||1)>1?" · x"+p.stock:""}</span><span class="yr-tag">~${p.ymin===p.ymax?p.ymin:p.ymin+'–'+p.ymax}</span></div><div class="bd"><h3>${e(p.personaje)}</h3><p>${e(p.serie)}</p><p>🏭 ${e(p.fabricacion)} · ${e(p.patente)}</p><p>⭐ ${e(p.estado)}</p><p class="v">💵 $${e(p.valor_clp)} CLP <span style="font-weight:400;color:var(--mut);font-size:.82rem">(Chile: $${e(p.venta_chile_clp)})</span></p></div></div>`).join('')||'<p>Sin resultados para ese filtro.</p>';
}
function ver(id){const p=D.find(x=>x.id==id);if(!p)return;document.getElementById('mi').innerHTML=p.imgs.map(s=>`<img src="${s}">`).join('');
